resolver 127.0.0.11 valid=30s;  # Docker's internal DNS resolver

map $http_user_agent $product_share_upstream {
    default "http://frontend";
    ~*(facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|whatsapp|telegrambot|discordbot|skypeuripreview|pinterest|googlebot|bingbot|crawler|preview) "http://backend";
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aurorablings.com www.aurorablings.com;

    # Allow Let's Encrypt ACME challenge over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name aurorablings.com www.aurorablings.com;

    ssl_certificate     /etc/letsencrypt/live/aurorablings.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurorablings.com/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    client_max_body_size 20M;
    keepalive_timeout 65;

    # ── Upstream keepalive ────────────────────────────────────────────────────
    # `proxy_http_version 1.1` and an empty Connection header are repeated in
    # every location below that proxies. They are NOT optional.
    #
    # Without both, nginx talks HTTP/1.0 to upstreams and sends
    # "Connection: close", which makes the `keepalive 32` / `keepalive 16`
    # declared on the upstreams above completely inert -- every proxied request
    # opens a fresh TCP connection to the container. On a high-latency link that
    # costs a full round trip per request, roughly 30 times per page load.
    #
    # They are inlined rather than pulled from an include file on purpose: only
    # this single file is bind-mounted into the nginx container (see
    # docker-compose.prod.yml), so an `include snippets/...` here would stop
    # nginx from starting at all.

    # ── Security headers ──────────────────────────────────────────────────────
    # These are ALSO repeated in every location that sets its own add_header.
    # nginx's add_header does not merge across levels -- the moment a location
    # declares one add_header, everything inherited from here is silently
    # dropped, and `always` does not change that. /staticfiles/, /media/ and
    # /assets/ all set their own Cache-Control, so all five below (including
    # HSTS) were being lost on exactly the paths that serve the most requests.
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip
    # comp_level 5 is the usual sweet spot: most of the ratio of level 9 at a
    # fraction of the CPU. min_length avoids spending CPU on tiny responses that
    # would not shrink (and can grow) -- the default of 20 bytes is far too low.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml
               application/manifest+json application/xhtml+xml;

    # ── Django static files (served directly by nginx) ────────────────────────
    location /staticfiles/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Frame-Options           "DENY"                             always;
        add_header X-Content-Type-Options    "nosniff"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        add_header X-XSS-Protection          "1; mode=block"                    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ── Django media files (served directly by nginx) ─────────────────────────
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options           "DENY"                             always;
        add_header X-Content-Type-Options    "nosniff"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        add_header X-XSS-Protection          "1; mode=block"                    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ── Vite build assets — must return JS/CSS, never HTML ────────────────────
    # Vite outputs hashed files to /assets/. We proxy to frontend but tell
    # nginx to fail hard (no fallback) if the file is missing, so a stale
    # HTML page is never returned as application/javascript.
    location ^~ /assets/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 = @asset_not_found;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options           "DENY"                             always;
        add_header X-Content-Type-Options    "nosniff"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        add_header X-XSS-Protection          "1; mode=block"                    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location @asset_not_found {
        return 404 "Asset not found";
    }

    # ── Django admin (backend, NOT frontend) ──────────────────────────────────
    # Admin SPA routes.
    #
    # /admin/ is shared ground: Django's own admin lives there, and so do the
    # dashboard's React routes. Proxying everything under it to Django meant a
    # refresh on /admin/settings reached a Django view that tried to read
    # frontend/dist/index.html -- a file the backend image does not contain --
    # and fell through to a redirect to "/". That is why refreshing the settings
    # page landed on the shop's home page.
    #
    # This list mirrors spa_admin_patterns in backend/config/urls.py. It must be
    # a regex block placed BEFORE the asset regex below, because nginx tries
    # regex locations in the order they are written and stops at the first match.
    location ~ ^/admin/(dashboard|categories|attributes|products|inventory|reviews|orders|customers|returns|coupons|banners|features|settings|shipments|notifications|newsletter|audit-logs|health|notify-requests|enquiries|tracking-settings|gtm-settings)(/.*)?$ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
    }

    # Django's own admin.
    location /admin/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ── SSI bootstrap fragment — tight timeout ────────────────────────────────
    # This exact path is fetched by nginx as an SSI subrequest while it is
    # holding index.html open, so its latency is added to the TTFB of EVERY HTML
    # page on the site. The generic /api/ location's 90s read timeout is
    # catastrophic here: `ssi_silent_errors` suppresses the error, not the wait,
    # so a merely slow (not dead) backend leaves the visitor staring at a blank
    # tab for up to a minute and a half.
    #
    # 2s is deliberately shorter than any reasonable render time for this view --
    # it is Redis-cached with a 5 minute TTL. If it cannot answer within 2s,
    # dropping the include is strictly better than making the visitor wait: the
    # SPA then fetches /banners/active/ and /features/public-settings/ itself,
    # exactly as it did before the bootstrap existed.
    #
    # An exact (`=`) match always wins over the `/api/` prefix match regardless
    # of order in the file; it is placed above for readability.
    location = /api/v1/banners/bootstrap-fragment/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout    2s;
        proxy_send_timeout    2s;
        access_log off;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ── Health endpoints (backend) ────────────────────────────────────────────
    location /health/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── SEO endpoints (backend) ───────────────────────────────────────────────
    location = /sitemap.xml {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /robots.txt {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Product share URLs: bots get backend-rendered OG tags, users get SPA ─
    location ^~ /product/ {
        proxy_pass         $product_share_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── React SPA — everything else goes to frontend ──────────────────────────
    # SSI: index.html carries <!--#include virtual="/api/v1/banners/bootstrap-fragment/" -->
    # resolved here (at the proxy layer, not in the frontend container) as a
    # subrequest through the dedicated exact-match location above → backend.
    # Injects the LCP image preload + window.__BOOT__ ahead of any JS execution.
    # ssi_silent_errors: a backend failure just drops the include and the SPA
    # fetches the APIs itself.
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSI cannot parse a compressed upstream response; force the frontend
        # container to send plain HTML. This layer re-gzips for the client.
        proxy_set_header   Accept-Encoding   "";
        proxy_read_timeout 30s;
        ssi on;
        ssi_silent_errors on;
    }
}
